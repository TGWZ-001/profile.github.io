<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanaphot Mungjongklangkul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;600&display=swap">
<style>
@property --ol{syntax:"<color>";initial-value:#000;inherits:true}
@keyframes blink{0%,42%{--ol:#000}58%,100%{--ol:#fff}}
:root{--ol:#000;--bg:#f4f3f8;--fg:#17142a;--mut:#6a6584;--card:#fff;--accent:#7c5cff;--c1:#7c5cff;--c2:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--ol:#fff;--bg:#000;--fg:#f4f4f6;--mut:#a3a3ad;--card:#050505}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--ol:#fff;--bg:#000;--fg:#f4f4f6;--mut:#a3a3ad;--card:#050505}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 Figtree,system-ui,sans-serif;transition:background .5s,color .5s}
h1,h2,.brand{font-family:Sora,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:2px solid var(--ol)}
.brand{font-weight:800;margin-right:auto;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;color:var(--lc);text-decoration:none;font-weight:600;font-size:14px;border:2px solid var(--ol);white-space:nowrap;transition:background .25s,transform .25s}
nav a:hover,nav a:focus-visible{background:color-mix(in srgb,var(--lc) 16%,transparent);transform:translateY(-2px);outline:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:600 14px Figtree,sans-serif;color:var(--fg);background:var(--card);border:2px solid var(--ol);border-radius:999px;padding:8px 16px;cursor:pointer;transition:transform .2s,background .3s}
.btn:hover{transform:translateY(-2px)}.btn:focus-visible,#play:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mode{width:42px;height:42px;padding:0;font-size:18px;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30}
main{max-width:860px;margin:0 auto;padding:68px 16px 48px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs .btn[aria-selected="true"]{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.panel[hidden]{display:none}
.main{position:fixed;top:50%;left:50%;height:1px;width:1px;background-color:#fff;border-radius:50%;z-index:-1;pointer-events:none;box-shadow:-24vw -44vh 2px 2px #fff,38vw -4vh 0px 0px #fff,-20vw -48vh 1px 2px #fff,-39vw 38vh 3px 1px #fff,-42vw -11vh 0px 3px #fff,12vw 15vh 3px 3px #fff,42vw 6vh 3px 2px #fff,-8vw 9vh 0px 2px #fff,34vw -38vh 1px 0px #fff,-17vw 45vh 3px 1px #fff,22vw -36vh 3px 2px #fff,-42vw 1vh 1px 0px #fff;animation:zoom 10s alternate infinite}
@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.5)}}
:root[data-theme="light"] .main{display:none}
.pad{padding:0 24px 26px}
section{margin-top:20px;padding:20px 22px;background:var(--card);border:2px solid var(--ol);border-radius:22px;transition:background .5s}
h2{margin:0 0 12px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--ol);border-radius:16px;color:var(--lc);text-decoration:none;transition:transform .25s,background .25s}
.lc:hover,.lc:focus-visible{transform:translateY(-3px);background:color-mix(in srgb,var(--lc) 14%,transparent);outline:none}
.lc svg{width:26px;height:26px}.lc b{display:block;color:var(--fg)}.lc small{color:var(--mut);word-break:break-all}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 18px}dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.work{padding:0;overflow:hidden;margin-top:14px}
.work img{display:block;width:100%;max-height:340px;object-fit:cover;border-bottom:2px solid var(--ol)}
.work .in{padding:16px 20px}.work h3{margin:0 0 4px;font-family:Sora,sans-serif}.work p{margin:0 0 10px;color:var(--mut)}
pre{margin:10px 0;padding:12px;border:2px solid var(--ol);border-radius:12px;overflow-x:auto;background:var(--bg);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips a{font-size:14px;font-weight:600;padding:6px 12px;border:2px solid var(--ol);border-radius:999px;color:var(--accent);text-decoration:none}
.empty{color:var(--mut)}
@media(max-width:560px){dl{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="main" aria-hidden="true"></div>
<button class="btn" id="mode" aria-label="Switch light or night mode">☀️</button>

<main>
    <section><h2>Profile links</h2><div class="grid" id="links"></div></section>
    <section><h2>Personal info</h2><dl id="info"></dl></section>
</main>


<script>
const LINKS=[
 {t:"github",n:"GitHub",h:"TGWZ-001",u:"https://github.com/TGWZ-001"},
 {t:"instagram",n:"Instagram",h:"tgwz001",u:"https://www.instagram.com/tgwz001/"},
 {t:"facebook",n:"Facebook",h:"exe.0011",u:"https://web.facebook.com/exe.0011"},
 {t:"discord",n:"Discord",h:"1031810765507788851",u:"https://discord.com/users/1031810765507788851"}];
const ICON={
 github:["#a78bfa",'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>'],
 instagram:["#e4405f",'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/>'],
 facebook:["#1877f2",'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'],
 discord:["#5865f2",'<path d="M8 7c2.7-1 5.3-1 8 0 1.6 2.5 2.3 5.2 2.1 8.2-1 .8-2 1.3-3.1 1.6l-1-1.6c-1.3.3-2.7.3-4 0l-1 1.6c-1.1-.3-2.1-.8-3.1-1.6C5.7 12.200 6.400 9.500 8 7z"/><circle cx="9.500" cy="12" r=".8"/><circle cx="14.500" cy="12" r=".8"/>']};

const $=i=>document.getElementById(i),R=document.documentElement;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=t=>`<svg class="ic" viewBox="0 0 24 24">${ICON[t][1]}</svg>`;
$("links").innerHTML=LINKS.map(k=>`<a class="lc" href="${k.u}" target="_blank" rel="noopener" style="--lc:${ICON[k.t][0]}">${svg(k.t)}<span><b>${k.n}</b><small>${k.h}</small></span></a>`).join("");
$("info").innerHTML=`<dt>Name</dt><dd>Mr.Kanaphot Mungjongklangkul</dd><dt>Birthday</dt><dd>11 February 2011</dd><dt>Nationality</dt><dd>Thai</dd>`;

/* theme */
function theme(){const d=R.dataset.theme==="dark";$("mode").textContent=d?"☀️":"🌙"}
const mq=matchMedia("(prefers-color-scheme:dark)");let manual=false;
function setT(d){R.dataset.theme=d?"dark":"light";theme()}
setT(mq.matches);
mq.addEventListener("change",e=>{if(!manual)setT(e.matches)});
$("mode").onclick=()=>{manual=true;setT(R.dataset.theme!=="dark")};

</script>
</body>
</html>
